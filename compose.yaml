name: workout-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workout_tracker
      POSTGRES_PASSWORD: workout_tracker_dev
      POSTGRES_DB: workout_tracker
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workout_tracker -d workout_tracker']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
